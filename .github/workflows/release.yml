name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=high
      - name: Reject embedded provider credentials
        run: |
          if git grep -I -n -E 'sk-[A-Za-z0-9_-]{20,}' -- . ':!package-lock.json'; then
            echo "A provider credential pattern was found in tracked release files." >&2
            exit 1
          fi

  publish-images:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: knowledge-relay
            dockerfile: Dockerfile
          - image: knowledge-relay-nanobot
            dockerfile: Dockerfile.nanobot
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Knowledge Relay self-hosted inbox
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  smoke-test:
    needs: publish-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start published images
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          cp .env.example .env
          printf '\nKNOWLEDGE_RELAY_IMAGE_TAG=%s\n' "${RELEASE_VERSION#v}" >> .env
          ./scripts/deploy-docker.sh
      - name: Verify services
        run: |
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:8787/health
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8787/
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8787/api/bootstrap
          docker compose exec -T knowledge-relay npm run verify:sqlite
          docker compose ps
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Stop services
        if: always()
        run: docker compose down --volumes

  github-release:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --generate-notes \
            --title "Knowledge Relay ${RELEASE_TAG}"
