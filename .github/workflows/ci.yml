name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run build:sqlite-native
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run package:plugin
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-relay-obsidian
          path: |
            release/knowledge-relay-obsidian.zip
            release/knowledge-relay-obsidian.sha256

  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            architecture: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - name: Build Knowledge Relay (${{ matrix.architecture }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          platforms: ${{ matrix.platform }}
      - name: Build Nanobot Runtime (${{ matrix.architecture }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.nanobot
          push: false
          platforms: ${{ matrix.platform }}
