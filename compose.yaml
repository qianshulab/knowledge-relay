services:
  nanobot:
    image: ghcr.io/qianshulab/knowledge-relay-nanobot:${KNOWLEDGE_RELAY_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.nanobot
    restart: unless-stopped
    init: true
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      NANOBOT_RUNTIME_API_KEY: ${NANOBOT_RUNTIME_API_KEY:?请在 .env 设置 NANOBOT_RUNTIME_API_KEY}
    volumes:
      - nanobot-data:/nanobot
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; [urllib.request.urlopen('http://127.0.0.1:%d/health' % port, timeout=3) for port in (8900, 8902)]"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  knowledge-relay:
    image: ghcr.io/qianshulab/knowledge-relay:${KNOWLEDGE_RELAY_IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      DEEPSEEK_API_KEY: ""
      NANOBOT_MANAGED: "false"
      NANOBOT_AUTO_RELOAD: "true"
      NANOBOT_BASE_URL: http://nanobot:8900/v1/
      NANOBOT_SEARCH_BASE_URL: http://nanobot:8902/v1/
      NANOBOT_CATALOG_URL: http://nanobot:8901/
      NANOBOT_API_KEY: ${NANOBOT_RUNTIME_API_KEY:?请在 .env 设置 NANOBOT_RUNTIME_API_KEY}
      NANOBOT_CONFIG: /nanobot/config.json
      NANOBOT_WORKSPACE: /nanobot/workspace
    depends_on:
      nanobot:
        condition: service_healthy
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/app/data
      - nanobot-data:/nanobot
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777

volumes:
  nanobot-data:
